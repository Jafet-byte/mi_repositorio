<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grand Theft Auto VI</title>
    <style>
        body {
            background-color: #000000; /* Fondo completamente negro */
            color: #ffffff;            /* Texto blanco para que resalte */
            font-weight: bold;         /* Toda la letra en negrita */
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }

        h1 {
            font-size: 4rem;
            text-transform: uppercase;
            letter-spacing: 3px;
            margin-bottom: 10px;
            /* Degradado estilo Vice City opcional para el título */
            background: linear-gradient(90deg, #ff007f, #ff8c00);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p {
            font-size: 1.2rem;
            color: #cccccc;
        }
    </style>
</head>
<body>

    <h1>Grand Theft Auto VI</h1>
    <p>Bienvenidos de nuevo a Vice City.</p>

</body>
</html>
